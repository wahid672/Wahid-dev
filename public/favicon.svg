<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="30" y1="20" x2="70" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Outer W strokes -->
  <path d="M22 34 L36 72 L50 44 L64 72 L78 34" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Apex Candlestick Accent forming letter A -->
  <line x1="50" y1="22" x2="50" y2="38" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Algorithmic & IoT Node -->
  <circle cx="50" cy="44" r="4.5" fill="#34d399" />
</svg>
