<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#1e293b" stroke-width="2" fill="none" />

  <!-- Logo Mark (Left Top) -->
  <g transform="translate(80, 80)">
    <rect width="90" height="90" rx="22" fill="#0b0f17" stroke="#334155" stroke-width="2" />
    <!-- Monogram W + A -->
    <path d="M20 31 L32 65 L45 40 L58 65 L70 31" stroke="url(#emeraldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="45" y1="20" x2="45" y2="34" stroke="url(#cyanGrad)" stroke-width="5.5" stroke-linecap="round" />
    <circle cx="45" cy="40" r="4" fill="#34d399" />
  </g>

  <!-- Available Tag -->
  <g transform="translate(190, 105)">
    <rect width="360" height="40" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" />
    <circle cx="20" cy="20" r="5" fill="#10b981" />
    <text x="36" y="25" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" font-family="monospace">
      Software House, MQL5 &amp; IoT Specialist
    </text>
  </g>

  <!-- Main Identity Headline -->
  <text x="80" y="260" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    Wahid Alimudin
  </text>
  <text x="80" y="320" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="600">
    Fullstack Software Engineer &amp; MQL5 Algorithmic Trading Developer
  </text>

  <!-- Value Description -->
  <text x="80" y="375" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Spesialisasi arsitektur web modern, otomasi robot trading MetaTrader 5, dan integrasi hardware IoT ESP32 RFID.
  </text>

  <!-- Live SaaS Founded Box -->
  <g transform="translate(80, 430)">
    <rect width="1040" height="120" rx="14" fill="#0b1324" stroke="#1e293b" stroke-width="1.5" />
    <text x="28" y="42" fill="#64748b" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">
      FOUNDER PLATFORM PRODUKSI:
    </text>
    <text x="28" y="80" fill="#f1f5f9" font-family="system-ui, monospace" font-size="18" font-weight="600">
      siakadponpes.com   |   psbonline.id   |   wanotif.web.id   |   presensirfid.web.id   |   smartapps.my.id
    </text>
  </g>
</svg>
